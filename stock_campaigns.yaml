# ============================================================================
# STOCK IL-2 CAMPAIGNS LIBRARY
# ============================================================================
# Known official IL-2 Great Battles campaigns with their countries
# Format: "Campaign Name": "Country"
#
# This is used for automatic country detection - no user validation needed!
# 
# Detection method: Reads &name="Campaign Name" from info.locale=eng.txt
#                   This means folder names can be anything - we use the
#                   official campaign name from the info file!
#
# You can add new stock campaigns or community campaigns here.
# The country must match one of: Germany, Soviet Union, USA, Britain
#
# Note: The campaign name must match EXACTLY what's in &name="..." 
#       (case-insensitive matching)
# ============================================================================

