# ============================================================================
# RANK PROGRESSION SCALING
# ============================================================================
# Adjusts rank requirements based on campaign length to maintain meaningful
# progression throughout campaigns of different lengths.
#
# How it works:
# - Longer campaigns get higher score multipliers
# - Formula: required_score = base_score * multiplier
# - Only affects RANKS, not awards
# - Stock IL-2 campaigns are typically 8-12 missions (factor 1.0)
#
# Example:
#   10-mission campaign: Major at 900 points (factor 1.0)
#   40-mission campaign: Major at 1350 points (factor 1.5)
#   60-mission campaign: Major at 1800 points (factor 2.0)
#
# Bracket formats (you can customize or add new ones):
#   "1-10"   = Missions 1 to 10 (range)
#   "71+"    = Missions 71 and above (open-ended)
#   "25"     = Exactly 25 missions (exact match)
#
# The system automatically finds the matching bracket for each campaign!
# ============================================================================
enable_popups: true 

rank_scaling:
  enabled: true  # Set to false to use base scores without scaling
  
  # Score multipliers based on total mission count
  # Feel free to adjust factors or add new brackets!
  # Examples:
  #   "15-25": 1.25  (add a new bracket)
  #   "100+": 3.0    (for mega-campaigns)
  factors:
    "1-10":    1.00   # Short campaigns (stock campaigns)
    "11-20":   1.15   # Medium-short campaigns  
    "21-30":   1.30   # Medium campaigns
    "31-40":   1.50   # Medium-long campaigns
    "41-50":   1.75   # Long campaigns
    "51-70":   2.00   # Very long campaigns
    "71+":     5.50   # Epic campaigns (70+ missions)

