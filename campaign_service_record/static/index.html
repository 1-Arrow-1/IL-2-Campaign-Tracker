<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IL-2 Campaign Service Record</title>
    
    <!-- Styles -->
    <link rel="stylesheet" href="static/css/main.css">
    <link rel="stylesheet" href="static/css/landing.css">
    <link rel="stylesheet" href="static/css/detail.css">
    <link rel="stylesheet" href="static/css/cropper.min.css">
</head>
<body>
    <!-- Application Container -->
    <div id="app">
        <!-- Header (persistent) -->
        <header id="app-header">
            <div class="header-content">
                <h1>IL-2 Campaign Service Record</h1>
                <nav id="header-nav">
                    <button id="back-btn" class="nav-btn" style="display: none;">
                        ← Back to Campaigns
                    </button>
                </nav>
            </div>
        </header>
        
        <!-- Main Content Area -->
        <main id="app-main">
            <!-- Landing Page -->
            <div id="landing-page" class="page">
                <div class="landing-container">
                    <!-- Left Column: Pilot Info -->
                    <aside class="pilot-info">
                        <div class="pilot-card">
                            <div class="pilot-photo-container">
                                <img id="pilot-photo" 
                                     src="static/images/placeholder_pilot.png" 
                                     alt="Pilot Photo"
                                     class="pilot-photo">
                                <img class="pilot-photo-overlay pilot-photo-overlay--edges"
                                     src="static/images/photo_edges.png"
                                     alt=""
                                     aria-hidden="true">
                                <img class="pilot-photo-overlay pilot-photo-overlay--rivets"
                                     src="static/images/rivets_overlay.png"
                                     alt=""
                                     aria-hidden="true">
                            </div>
                            <button id="pilot-photo-btn" class="pilot-photo-btn" type="button">
                                Choose Pilot Photo
                            </button>
                            <div class="pilot-details">
                                <h2 id="pilot-name">Campaign Pilot</h2>
                                <p class="pilot-meta">
                                    <span class="label">Service:</span>
                                    <span id="pilot-service">Multiple Campaigns</span>
                                </p>
                            </div>
                        </div>
                    </aside>
                    
                    <!-- Right Column: Campaign List -->
                    <section class="campaigns-section">
                        <h2>Campaigns Flown</h2>
                        
                        <!-- Loading State -->
                        <div id="campaigns-loading" class="loading-state">
                            <div class="spinner"></div>
                            <p>Loading campaigns...</p>
                        </div>
                        
                        <!-- Empty State -->
                        <div id="campaigns-empty" class="empty-state" style="display: none;">
                            <p class="empty-message">
                                No campaigns found.<br>
                                <small>Run Campaign Tracker first to generate data.</small>
                            </p>
                        </div>
                        
                        <!-- Error State -->
                        <div id="campaigns-error" class="error-state" style="display: none;">
                            <p class="error-message" id="error-text"></p>
                        </div>
                        
                        <!-- Campaign List -->
                        <div id="campaigns-list" class="campaigns-list" style="display: none;">
                            <!-- Dynamically populated by JavaScript -->
                        </div>
                    </section>
                </div>
            </div>
            
            <!-- Detail Page -->
            <div id="detail-page" class="page" style="display: none;">
                <div class="detail-container">
                    <!-- Campaign Header -->
                    <header class="campaign-header">
                        <div class="campaign-header__aircraft-row" aria-hidden="true">
                            <!-- img id="campaign-insignia-left" class="campaign-header__insignia campaign-header__insignia--left" alt=""!-->
                            <img id="campaign-plane" class="campaign-header__plane-image" alt="">
                            <!--img id="campaign-insignia-right" class="campaign-header__insignia campaign-header__insignia--right" alt=""!-->
                        </div>
                        <h2 id="campaign-title">Campaign Name</h2>                   
                        <img class="campaign-header__stamp" src="static/images/stamp_extra_II.png" alt="Campaign stamp">
                        <div class="campaign-meta">
                            <span class="meta-item">
                                <span class="label">Country:</span>
                                <span id="campaign-country">—</span>
                            </span>
                            <span class="meta-item">
                                <span class="label">Missions:</span>
                                <span id="campaign-missions">—</span>
                            </span>
                        </div>
                    </header>
                    
                    <!-- 3-Column Layout -->
                    <div class="detail-columns">
                        <!-- Left Column: Promotions & Awards -->
                        <aside class="column column-left">
                            <section class="events-section">
                                <h3>Promotions & Awards</h3>
                                <div id="events-list" class="events-list">
                                    <!-- Dynamically populated -->
                                </div>
                            </section>
                        </aside>
                        
                        <!-- Middle Column: Summary -->
                        <section class="column column-middle">
                            <section class="summary-section">
                                <h3>Campaign Summary</h3>
                                <div id="summary-content" class="summary-content">
                                    <!-- Dynamically populated -->
                                </div>
                            </section>
                        </section>

                        <!-- Right Column: Debriefings -->
                        <aside class="column column-right">
                            <h3>Mission Debriefings</h3>
                            <div id="debriefings-container" class="debriefings-container">
                                <!-- HTML injected from campaign_events.json -->
                            </div>
                        </aside>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Cropper Modal -->
    <div id="cropper-modal" class="cropper-modal" style="display: none;">
        <div class="cropper-modal-content">
            <h3>Crop Pilot Photo</h3>
            <img id="cropper-img" alt="Crop pilot photo">
            <label class="pilot-name-field" for="pilot-name-input">
                Pilot name
                <input id="pilot-name-input" type="text" maxlength="40" placeholder="Campaign Pilot">
            </label>
            <div class="cropper-actions">
                <button id="cropper-save" type="button">Save</button>
                <button id="cropper-cancel" type="button">Cancel</button>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="static/js/api.js?v=2"></script>
    <script src="static/js/cropper.min.js"></script>
    <script src="static/js/landing.js?v=2"></script>
    <script src="static/js/detail.js?v=2"></script>
    <script src="static/js/main.js?v=2"></script>
</body>
</html>
